<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1917;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#292524;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Interior Space Plan -->
  <rect x="180" y="160" width="440" height="300" fill="rgba(245,158,11,0.04)" stroke="#f59e0b" stroke-width="2" />
  
  <!-- Room partitions -->
  <line x1="380" y1="160" x2="380" y2="340" stroke="#f59e0b" stroke-width="2" />
  <line x1="180" y1="340" x2="480" y2="340" stroke="#f59e0b" stroke-width="2" />
  
  <text x="280" y="250" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#fbbf24" text-anchor="middle">Master Lounge</text>
  <text x="500" y="250" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#fbbf24" text-anchor="middle">Open Kitchen & Island</text>
  <text x="330" y="400" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#fbbf24" text-anchor="middle">Terrace & Fireplace</text>
  
  <text x="60" y="80" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700" fill="#ffffff">Nordic Haven Alpine Penthouse</text>
  <text x="60" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#d6d3d1">Space Zoning & Millwork Integration · Aspen, CO</text>
</svg>

