<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#090d16;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Architectural drafting elevation -->
  <path d="M 100 480 L 320 220 L 700 480 Z" fill="none" stroke="rgba(245,158,11,0.5)" stroke-width="2.5" />
  <path d="M 180 480 L 320 220 L 520 480 Z" fill="rgba(245,158,11,0.05)" stroke="rgba(245,158,11,0.3)" stroke-width="1.5" />
  <line x1="80" y1="480" x2="720" y2="480" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
  <line x1="320" y1="220" x2="320" y2="480" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="4" />
  
  <!-- Dimension lines -->
  <line x1="100" y1="510" x2="700" y2="510" stroke="rgba(251,191,36,0.6)" stroke-width="1.5" />
  <line x1="100" y1="505" x2="100" y2="515" stroke="rgba(251,191,36,0.6)" stroke-width="1.5" />
  <line x1="700" y1="505" x2="700" y2="515" stroke="rgba(251,191,36,0.6)" stroke-width="1.5" />
  
  <text x="375" y="525" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#fbbf24" text-anchor="middle">45.00 m</text>
  
  <circle cx="320" cy="220" r="5" fill="#f59e0b" />
  
  <text x="60" y="80" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700" fill="#ffffff">The Glass Pavilion</text>
  <text x="60" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#94a3b8">Minimalist Oceanfront Villa · Architectural Elevation Drafting</text>
</svg>

